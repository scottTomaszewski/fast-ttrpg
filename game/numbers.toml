# Every number in the game. The simulator reads this file, and the class
# sheets and cards will be made from it. Change a number here, nowhere else.

[rules]
hero_move = 6
bleeding_cards = 3     # rounds to save a downed hero
haul_up_hp = 5         # HP after an ally hauls you up
combo_max = 3
combo_per_hit = 1      # combo points a Rogue gets for each auto-attack die that hits, and for a Backstab
backstab_hidden_multiplier = 2   # a Backstab from hiding hits this many times as hard
sneak_die = 6          # the Rogue's stealth check before the fight: one die with this many sides...
sneak_target = 4       # ...and she gets next to her enemy unseen on this or more
seeds_max = 2
grit_per_attack = 2    # grit the Guardian gets each time an enemy attacks him (not a blast)
boss_loud_cards = 1    # Taunt cards a Loud hit takes off a boss
max_rounds = 60        # the simulator gives up after this many

[heroes.guardian]
hp = 110
die = 8
attack_range = 1
resource = "grit"
pool = 10
start = 4              # grit for two Taunts, so he can hold the boss from round 1 (owner 2026-11-27)
regen = 0
crit_gain = 1          # grit

[heroes.rogue]
hp = 36
die = 6
attack_range = 1
resource = "energy"
pool = 10
start = 10
regen = 3
crit_gain = 1          # one extra combo point

[heroes.druid]
hp = 36
die = 6
attack_range = 8
resource = "energy"
pool = 10
start = 10
regen = 3
crit_gain = 1          # a Seed

[heroes.mage]
hp = 28
die = 4
attack_range = 10
resource = "mana"
pool = 30
start = 30
regen = 1
crit_gain = 2          # mana
auto_gain = 1          # mana back from each auto-attack that does not miss

# Ability fields: cost, cast (rounds), hits (channel), range, radius,
# dice = [count, sides], bonus, cards (how long it lasts), value (what each
# card is worth), alt (a second number, explained per ability), loud, cooldown,
# still (true: a channel the hero must stand still for; moving ends it),
# benched (true: kept here and in the code, but out of the game for now:
# nobody uses it, and it is left off the rules and the checks).
# A field left out is 0 (or false). An ability with no range needs no reach:
# it is used on yourself, or around you. Range 1 means next to you.

[abilities.taunt]
hero = "guardian"
cost = 2
range = 6
cards = 3

[abilities.challenging_shout]
hero = "guardian"
cost = 3
radius = 4
cards = 1

[abilities.intercede]
hero = "guardian"
cost = 2
range = 6
cards = 1
value = 4             # damage taken off each hit on the guarded ally

[abilities.grip]
hero = "guardian"
cost = 2
range = 6

[abilities.shield_plant]
hero = "guardian"
cost = 4
radius = 2             # how deep "behind you" goes
cards = 1
value = 8              # damage taken off the blast

[abilities.last_stand]
hero = "guardian"
cost = 5
cards = 1

[abilities.shield_slam]
hero = "guardian"
cost = 0               # free: the Guardian is short of turns, not of grit
range = 1
dice = [2, 8]          # two of his d8s
alt = 1                # grit it gives (never past his pool)
cooldown = 2
loud = false

[abilities.backstab]
hero = "rogue"
cost = 5
range = 1
dice = [2, 6]

[abilities.eviscerate]
hero = "rogue"
cost = 3
range = 1
dice = [1, 6]          # per combo point
loud = true

[abilities.kidney_shot]
hero = "rogue"
cost = 3
range = 1
cards = 1
alt = 2                # cards at full combo points

[abilities.cheap_shot]
hero = "rogue"
cost = 2
range = 1
cards = 1

[abilities.sap]
hero = "rogue"
cost = 3
range = 1
cards = 20             # long: a sapped enemy is out for most of the fight, unless something hurts it

[abilities.shadowstep]
hero = "rogue"
cost = 5               # the owner's number (2026-11-27)
range = 8

[abilities.vanish]
hero = "rogue"
cost = 4

[abilities.rejuvenation]
hero = "druid"
cost = 2
range = 8
cards = 4
value = 4

[abilities.regrowth]
hero = "druid"
cost = 4
cast = 1
range = 8
dice = [3, 6]
bonus = 4
loud = true

[abilities.swiftmend]
hero = "druid"
cost = 2               # free on an ally below half HP
range = 8
dice = [2, 6]
bonus = 2

[abilities.wild_growth]
hero = "druid"
cost = 5
range = 8
radius = 2
cards = 2
value = 4

[abilities.cleanse]
hero = "druid"
cost = 1
range = 8

[abilities.shadowmeld]
hero = "druid"
cost = 2
value = 3              # squares moved

[abilities.nourish]
hero = "druid"
range = 8
dice = [1, 6]
alt = 2                # energy back on the top face

[abilities.arcane_volley]
hero = "mage"
cost = 2               # per hit
hits = 3
range = 10
dice = [2, 6]          # a whole Volley (21 for 6 mana) does as much for its mana as a Firebolt (14 for 4)
loud = false           # the everyday spell: Loud on every hit would keep pulling enemies off the Guardian

[abilities.firebolt]
hero = "mage"
cost = 4
cast = 1
range = 10
dice = [4, 6]

[abilities.meteor]
hero = "mage"
cost = 10
cast = 2
range = 10
radius = 2
dice = [8, 6]

[abilities.frost_nova]
hero = "mage"
cost = 3
cards = 2

[abilities.blink]
hero = "mage"
cost = 2
range = 6

[abilities.quicken]
hero = "mage"
benched = true         # benched 2026-11-27 by the owner; may come back
cost = 8
cards = 2
value = 2              # dice for each auto-attack while quickened

[abilities.polymorph]
hero = "mage"
cost = 4
cast = 1
range = 10
cards = 12             # about half a fight; Sap is the longer one

[abilities.ice_block]
hero = "mage"
cost = 0
cards = 1              # one card covers the GM turn after she uses it
cooldown = 8

[abilities.evocation]
hero = "mage"
cost = 0
hits = 2               # a channel for 2 rounds...
value = 6              # ...giving this much mana each round (never past her pool)
still = true           # she must stand still: moving ends it
cooldown = 8

[abilities.disrupt]
hero = "shared"
range = 1
alt = 10               # the Mage's range
cooldown = 3
