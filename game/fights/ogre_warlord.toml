name = "Ogre Warlord"
width = 16
height = 12
extra_starts = [[2, 7], [1, 6], [2, 6], [1, 8]]

[hero_starts]
guardian = [3, 6]
rogue = [2, 5]
druid = [1, 7]
mage = [1, 5]

[enemy_types.ogre]
tier = "boss"
hp = 115
dice = [2, 6]          # the boss rolls its melee hit
bonus = 9
move = 4
range = 1
prefers = "backline"   # with no Taunt cards on it, it goes for the soft heroes

[enemy_types.shaman]   # stands back, poisons, and heals the boss unless stopped
hp = 24
damage = 2
move = 4
range = 8
prefers = "random"
poison_cards = 3
poison_value = 2
cast_first = 2
cast_every = 4
cast_heal = 25

[enemy_types.wolf]     # runs past the tank
hp = 20
damage = 3
move = 7
range = 1
prefers = "backline"

[enemy_types.brute]    # Shielded: ignores hits below 3
tier = "elite"         # plays like a normal enemy; Sap and the heroes' rules look for elites
hp = 30
damage = 4
move = 4
range = 1
prefers = "nearest"
shielded = 3

[enemy_types.goblin]    # comes late and runs at the back line
tier = "fodder"
hp = 1
damage = 3
move = 3
range = 1
prefers = "backline"

[[spawns]]
type = "ogre"
pos = [11, 6]
[[spawns]]
type = "brute"
pos = [10, 7]
[[spawns]]
type = "shaman"
pos = [13, 3]
[[spawns]]
type = "wolf"
pos = [10, 3]
[[spawns]]
type = "wolf"
pos = [10, 9]

# one wave of five goblins on the far edge, in round 10
[[spawns]]
type = "goblin"
pos = [15, 3]
round = 10
[[spawns]]
type = "goblin"
pos = [15, 4]
round = 10
[[spawns]]
type = "goblin"
pos = [15, 5]
round = 10
[[spawns]]
type = "goblin"
pos = [15, 6]
round = 10
[[spawns]]
type = "goblin"
pos = [15, 7]
round = 10

# The boss announces at most one of these per turn; the first that is due wins.
# The timings matter for how long a fight lasts: a Ground Slam makes the
# heroes next to the boss step away for a turn. See docs/tuning-log.md.
[[boss_script]]
name = "ground_slam"   # announced blast around the boss
kind = "blast"
first = 4
every = 6
radius = 2
dice = [3, 6]

[[boss_script]]
name = "skull_crusher" # announced heavy hit on whoever the boss is attacking
kind = "heavy"
first = 6
every = 5
dice = [6, 6]

[[boss_script]]
name = "boulder"       # not announced; thrown at a random hero not next to the boss
kind = "throw"
first = 2
every = 2
dice = [2, 6]

# Stomp comes in rounds 8, 14 and 20 of a 20-round fight, never with the
# Ground Slam (4, 10, 16) or the Skull Crusher (6, 11, 16, 21). It is last
# in the list, so in a long fight a Crusher due the same round (26) wins.
[[boss_script]]
name = "stomp"         # announced; stuns every hero next to the boss
kind = "stomp"
first = 8
every = 6
radius = 1             # the squares next to him
dice = [1, 6]
stun = 1               # stun cards for each hero it hits
