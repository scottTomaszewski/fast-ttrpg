[project]
name = "fastcombat"
version = "0.1.0"
description = "Plays fights of the fast combat rules over and over to test the numbers."
authors = [
    { name = "Scott Tomaszewski", email = "scottTomaszewski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fastcombat = "fastcombat.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: plays hundreds of fights"]
addopts = "-m 'not slow'"
